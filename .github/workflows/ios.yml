name: Inspect GameAPI Headers

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Print Game.h Full Content
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          find GAPI/C -type f
          cat GAPI/C/GameAPI/Game.h
