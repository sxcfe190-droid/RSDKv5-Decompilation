name: Inspect SDL2RenderDevice Escape Case
on:
  workflow_dispatch:
jobs:
  inspect-escape:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"

      - name: Print SDL2RenderDevice.cpp lines 835 to 870
        run: |
          nl -ba RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp | sed -n '835,870p'
