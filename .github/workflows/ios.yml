name: Inspect Controller Mapping Code
on:
  workflow_dispatch:
jobs:
  inspect-code:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print Controller INI & Mapping Source
        run: |
          python3 - << 'EOF'
          import glob

          keywords = ["Keyboard Map", "SDL_CONTROLLER_BUTTON", "SDL_GameController", "Controller", "buttonA", "select"]

          for path in sorted(glob.glob("RSDKv5/RSDK/**/*.cpp", recursive=True) + glob.glob("RSDKv5/RSDK/**/*.h", recursive=True)):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              
              hits = []
              for i, line in enumerate(lines):
                  if any(k in line for k in ["Keyboard Map", "SDL_CONTROLLER_BUTTON_", "InitControllers", "LoadSettings", "SaveSettings"]):
                      start = max(0, i - 5)
                      end = min(len(lines), i + 25)
                      hits.append((i + 1, "".join(f"{ln+1}: {lines[ln]}" for ln in range(start, end))))
              
              if hits:
                  print(f"\n==================== FILE: {path} ====================")
                  for line_no, block in hits:
                      print(f"--- Match around line {line_no} ---")
                      print(block)
          EOF
