name: Inspect GameAPI Headers

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Clone & Print GameAPI Function Tables
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          echo "=== ModFunctionTable ==="
          grep -rn -A 35 "struct ModFunctionTable" GAPI/C/
          echo "=== RSDKFunctionTable (Save) ==="
          grep -rn -i "Save" GAPI/C/
