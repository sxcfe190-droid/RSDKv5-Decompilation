name: Check SaveRAM Pointer in GameAPI

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Check ModTable SaveRAM Functions
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          grep -rn -i "SaveRAM\|GetGlobals\|UserFile" GAPI/C/GameAPI/
