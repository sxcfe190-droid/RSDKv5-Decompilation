name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios
          submodules: recursive
      - name: Patch engine and audio/input
        run: |
          PBX="dependencies/ios/SDL/Xcode/SDL"
          PBX="$PBX/SDL.xcodeproj/project.pbxproj"
          sed -i '' 's/name = Framework;/name = Framework-macOS;/g' "$PBX"
          cat << 'EOF' > patch.py
          import glob, re

          p = "RSDKv5/RSDK/Core/ModAPI.cpp"
          s = open(p, encoding="utf-8").read()
          s = s.replace(
              'sprintf(customUserFileDir, "%smods/%s/", SKU::appFileDir',
              'sprintf(customUserFileDir, "%smods/%s/", SKU::userFileDir'
          )
          s = s.replace(
              'sprintf_s(modBuf, sizeof(modBuf), "%smods", SKU::appFileDir);',
              'sprintf_s(modBuf, sizeof(modBuf), "%smods", SKU::userFileDir);'
              ' std::filesystem::create_directories(modBuf);'
          )
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/Core/Link.hpp"
          s = open(p, encoding="utf-8").read()
          old_dl = 'ret  = (Handle)dlopen(path.c_str(), RTLD_LOCAL | RTLD_LAZY);'
          new_dl = old_dl + '\n        if (!ret) ret = (Handle)dlopen(("@rpath/" + path).c_str(), RTLD_LOCAL | RTLD_LAZY);'
          assert old_dl in s
          open(p, "w", encoding="utf-8").write(s.replace(old_dl, new_dl, 1))

          p = "RSDKv5/RSDK/Dev/Debug.cpp"
          s = open(p, encoding="utf-8").read()
          s = s.replace("if (modList.size() != 0)", "if (true)")
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/User/Core/UserCore.cpp"
          s = open(p, encoding="utf-8").read()
          no_map = "{ " + ", ".join(["KEYMAP_NO_MAPPING"] * 12) + " }"
          s, n_vk = re.subn(
              r"\{ VK_UP,[^}]+\},\s*\{ VK_NUMPAD8,[^}]+\},",
              f"{no_map},\n        {no_map},",
              s, count=1
          )
          assert n_vk == 1
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp"
          s = open(p, encoding="utf-8").read()
          btns = (
              "SDL_CONTROLLER_BUTTON_DPAD_UP, SDL_CONTROLLER_BUTTON_DPAD_DOWN, "
              "SDL_CONTROLLER_BUTTON_DPAD_LEFT, SDL_CONTROLLER_BUTTON_DPAD_RIGHT, "
              "SDL_CONTROLLER_BUTTON_A, SDL_CONTROLLER_BUTTON_B, "
              "SDL_CONTROLLER_BUTTON_INVALID, SDL_CONTROLLER_BUTTON_X, "
              "SDL_CONTROLLER_BUTTON_Y, SDL_CONTROLLER_BUTTON_INVALID, "
              "SDL_CONTROLLER_BUTTON_START, SDL_CONTROLLER_BUTTON_BACK, "
              "SDL_CONTROLLER_BUTTON_INVALID, SDL_CONTROLLER_BUTTON_INVALID, "
              "SDL_CONTROLLER_BUTTON_LEFTSHOULDER, SDL_CONTROLLER_BUTTON_RIGHTSHOULDER"
          )
          masks = (
              "KEYMASK_UP, KEYMASK_DOWN, KEYMASK_LEFT, KEYMASK_RIGHT, "
              "KEYMASK_A, KEYMASK_B, KEYMASK_C, KEYMASK_X, KEYMASK_Y, KEYMASK_Z, "
              "KEYMASK_START, KEYMASK_SELECT, KEYMASK_STICKL, KEYMASK_STICKR, "
              "(KEYMASK_Z | KEYMASK_BUMPERL), (KEYMASK_C | KEYMASK_BUMPERR)"
          )
          s, n1 = re.subn(r"int32\s+buttonMap\[\]\s*=\s*\{[^;]+\};", f"int32 buttonMap[] = {{ {btns} }};", s, count=1)
          s, n2 = re.subn(r"int32\s+keyMasks\[\]\s*=\s*\{[^;]+\};", f"int32 keyMasks[] = {{ {masks} }};", s, count=1)
          assert n1 == 1 and n2 == 1
          s = s.replace("device->swapABXY = true;", "device->swapABXY = false;")
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp"
          s = open(p, encoding="utf-8").read()
          assert "case SDL_SCANCODE_ESCAPE:" in s
          s = s.replace(
              "case SDL_SCANCODE_ESCAPE:\n                        if (engine.devMenu) {",
              "case SDL_SCANCODE_ESCAPE:\n                        if (false && engine.devMenu) {"
          )
          assert "if (false && engine.devMenu)" in s
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/Core/RetroEngine.cpp"
          s = open(p, encoding="utf-8").read()
          tgt = "if (controller[CONT_P1].keySelect.press)"
          rep = (
              "bool32 anyJump = controller[CONT_ANY].keyA.down || controller[CONT_ANY].keyB.down"
              " || controller[CONT_ANY].keyC.down || controller[CONT_ANY].keyX.down"
              " || controller[CONT_ANY].keyY.down || controller[CONT_ANY].keyA.press"
              " || controller[CONT_ANY].keyB.press || controller[CONT_ANY].keyC.press"
              " || controller[CONT_ANY].keyX.press || controller[CONT_ANY].keyY.press;\n"
              "    if (!anyJump && (controller[CONT_P1].keySelect.press || controller[CONT_ANY].keySelect.press))"
          )
          assert tgt in s
          open(p, "w", encoding="utf-8").write(s.replace(tgt, rep, 1))

          p = "dependencies/ios/SDL/src/audio/coreaudio/SDL_coreaudio.m"
          s = open(p, encoding="utf-8").read()
          assert "AVAudioSessionCategoryPlayback;" in s
          s = s.replace("AVAudioSessionCategoryPlayback;", "AVAudioSessionCategoryAmbient;", 1)
          s = s.replace("options |= AVAudioSessionCategoryOptionDuckOthers;", "// duck off", 1)
          open(p, "w", encoding="utf-8").write(s)

          p = "RSDKv5/RSDK/Audio/SDL2/SDL2AudioDevice.cpp"
          s = open(p, encoding="utf-8").read()
          assert "if ((device = SDL_OpenAudioDevice(" in s
          s = s.replace(
              "if ((device = SDL_OpenAudioDevice(",
              'SDL_SetHint(SDL_HINT_AUDIO_CATEGORY, "AVAudioSessionCategoryAmbient");\n    if ((device = SDL_OpenAudioDevice(',
              1
          )
          open(p, "w", encoding="utf-8").write(s)

          files = (
              glob.glob("RSDKv5/RSDK/**/*.cpp", recursive=True) +
              glob.glob("Game/**/*.c", recursive=True) +
              glob.glob("Game/**/*.cpp", recursive=True) +
              glob.glob("Game/**/*.h", recursive=True)
          )
          for fp in files:
              s = open(fp, encoding="utf-8", errors="ignore").read()
              o = s
              s = s.replace("devMenu = false;", "devMenu = true;").replace("devMenu = 0;", "devMenu = 1;")
              s = s.replace("streamsEnabled = false;", "streamsEnabled = true;").replace("streamsEnabled = 0;", "streamsEnabled = 1;")
              if "SDL_CreateWindow(" in s:
                  s = s.replace("SDL_WINDOW_FULLSCREEN_DESKTOP", "SDL_WINDOW_RESIZABLE")
                  s = s.replace("SDL_WINDOW_FULLSCREEN", "SDL_WINDOW_RESIZABLE")
                  s = s.replace("SDL_WINDOW_SHOWN", "SDL_WINDOW_SHOWN | SDL_WINDOW_RESIZABLE")
              if "SDL_InitSubSystem" in s:
                  s = s.replace("SDL_InitSubSystem(", 'SDL_SetHint(SDL_HINT_ACCELEROMETER_AS_JOYSTICK, "0"); SDL_InitSubSystem(')
              s = s.replace("#define MANIA_USE_PLUS 0", "#define MANIA_USE_PLUS 1")
              s = s.replace("dlcEnabled = false;", "dlcEnabled = true;").replace("dlcEnabled = 0;", "dlcEnabled = 1;")
              s = s.replace("API.CheckDLC(DLC_PLUS)", "true").replace("CheckDLC(DLC_PLUS)", "true")
              if s != o:
                  open(fp, "w", encoding="utf-8", errors="ignore").write(s)
          EOF
          python3 patch.py
          cat << 'EOF' > RSDKv5/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.3.2</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIRequiresFullScreen</key><false/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>GCSupportedGameControllers</key>
            <array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>
            <key>GCSupportsControllerUserInteraction</key><true/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict></plist>
          EOF

      - name: Build RSDKv5 and SaveEditor Mod
        run: |
          DEFS='$(inherited) RETRO_USE_MOD_LOADER=1 RETRO_MOD_LOADER=1'
          DEFS="$DEFS RETRO_REVISION=3 MANIA_USE_PLUS=1 RETRO_USE_ORIGINAL_CODE=0"
          xcodebuild -project RSDKv5.xcodeproj -scheme RSDKv5 \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            GCC_PREPROCESSOR_DEFINITIONS="$DEFS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out"
          mkdir -p SaveEditorMod/Objects
          cat << 'EOF' > SaveEditorMod/Objects/Misc.h
          #ifndef OBJ_MISC_H
          #define OBJ_MISC_H
          #include "GameAPI/Game.h"
          typedef enum {
              PLAYMODE_NONE = 0, PLAYMODE_REGULAR = 1,
              PLAYMODE_ENCORE = 2, PLAYMODE_TIMEATTACK = 4,
              PLAYMODE_COMPETITION = 8
          } PlayModes;
          typedef enum {
              ZONE_GHZ = 0, ZONE_CPZ = 1, ZONE_SPZ = 2, ZONE_FBZ = 3,
              ZONE_PGZ = 4, ZONE_SSZ = 5, ZONE_HCZ = 6, ZONE_MSZ = 7,
              ZONE_OOZ = 8, ZONE_LRZ = 9, ZONE_MMZ = 10, ZONE_TMZ = 11,
              ZONE_ERZ = 12, ZONE_MAX = 13
          } ZoneIDs;
          #endif
          EOF

          cat << 'EOF' > SaveEditorMod/Objects/GameProgress.h
          #ifndef OBJ_GAMEPROGRESS_H
          #define OBJ_GAMEPROGRESS_H
          #include "GameAPI/Game.h"
          typedef enum { MEDAL_SILVER = 1, MEDAL_GOLD = 2 } MedalTypes;
          typedef struct {
              uint8 goldMedals;
              uint8 silverMedals;
              uint8 field_2;
              uint8 field_3;
              uint32 allGoldMedals;
              uint32 allSilverMedals;
              uint8 unlockedStages;
              uint8 emeraldObtained;
              uint8 unreadNotifs;
          } GameProgress;
          #endif
          EOF

          cat << 'EOF' > SaveEditorMod/Objects/SaveGame.h
          #ifndef OBJ_SAVEGAME_H
          #define OBJ_SAVEGAME_H
          #include "GameAPI/Game.h"
          typedef enum {
              SAVEFILE_EMPTY = 0,
              SAVEFILE_REGULAR = 1,
              SAVEFILE_COMPLETE = 2
          } SaveStates;
          typedef struct {
              uint8 saveState;
              uint8 characterID;
              uint8 zoneID;
              uint8 lives;
              int32 score;
              int32 score1UP;
              uint8 chaosEmeralds;
              uint8 continues;
              uint8 characterFlags;
              uint8 stock;
              uint16 playerID;
              uint16 filter;
              int32 collectedSpecialRings;
              int32 nextSpecialRing;
              int32 scoreBonus;
              int32 padding;
          } SaveRAM;
          typedef struct {
              SaveRAM slots;
              uint8 padding_end;
          } SaveDataFile;
          #endif
          EOF

          cat << 'EOF' > SaveEditorMod/Objects/UIMedallionPanel.h
          #ifndef OBJ_UIMEDALLIONPANEL_H
          #define OBJ_UIMEDALLIONPANEL_H
          #include "GameAPI/Game.h"
          #include "GameProgress.h"
          typedef struct { RSDK_OBJECT uint16 aniFrames; } ObjectUIMedallionPanel;
          typedef struct {
              RSDK_ENTITY
              StateMachine(state);
              int32 timer;
              uint8 column;
              uint8 row;
              uint8 medal;
              uint8 panelX;
              uint8 panelY;
              Animator animator;
          } EntityUIMedallionPanel;
          extern ObjectUIMedallionPanel *UIMedallionPanel;
          bool32 UIMedallionPanel_State_Selected_Hook(bool32 skipped);
          #endif
          EOF

          cat << 'EOF' > SaveEditorMod/Objects/UIMedallionPanel.c
          #include "UIMedallionPanel.h"
          #include "Misc.h"
          ObjectUIMedallionPanel *UIMedallionPanel;
          bool32 UIMedallionPanel_State_Selected_Hook(bool32 skipped) {
              (void)skipped;
              RSDK_THIS(UIMedallionPanel);
              bool32 touched = false;
              if (TouchInfo->count) {
                  int32 sx = ScreenInfo[SceneInfo->currentScreenID].size.x;
                  int32 sy = ScreenInfo[SceneInfo->currentScreenID].size.y;
                  for (int32 t = 0; t < TouchInfo->count; ++t) {
                      int32 tx = (int32)(TouchInfo->x[t] * sx);
                      int32 ty = (int32)(TouchInfo->y[t] * sy);
                      if (TouchInfo->down[t] && tx >= 0 && ty >= sy - 32 && tx <= 32 && ty <= sy) {
                          touched = true;
                          break;
                      }
                  }
              }
              static bool32 prevTouch = false;
              bool32 touchPress = touched && !prevTouch;
              prevTouch = touched;
              if (TriggerInfoR[CONT_ANY].keyBumper.press || touchPress) {
                  GameProgress *progress = (GameProgress *)Mod.GetGlobals();
                  uint8 id = self->column + 8 * self->row;
                  if (self->medal == 0) {
                      self->medal = MEDAL_SILVER;
                      progress->silverMedals++;
                      progress->unlockedStages[id] = true;
                      progress->allSilverMedals |= (1 << id);
                      progress->allGoldMedals &= ~(1 << id);
                  } else if (self->medal == MEDAL_SILVER) {
                      self->medal = MEDAL_GOLD;
                      progress->silverMedals--;
                      progress->goldMedals++;
                      progress->unlockedStages[id] = true;
                      progress->allSilverMedals |= (1 << id);
                      progress->allGoldMedals |= (1 << id);
                  } else if (self->medal == MEDAL_GOLD) {
                      self->medal = 0;
                      progress->goldMedals--;
                      progress->unlockedStages[id] = false;
                      progress->allSilverMedals &= ~(1 << id);
                      progress->allGoldMedals &= ~(1 << id);
                  }
                  RSDK.SetSpriteAnimation(UIMedallionPanel->aniFrames, 5, &self->animator, true, self->medal);
                  RSDK.PlaySfx(RSDK.GetSfx("Stage/SpecialRing.wav"), false, 255);
              }
              return false;
          }
          EOF
          cat << 'EOF' > SaveEditorMod/Objects/UISaveSlot.h
          #ifndef OBJ_UISAVESLOT_H
          #define OBJ_UISAVESLOT_H
          #include "GameAPI/Game.h"
          #include "SaveGame.h"
          #include "Misc.h"
          typedef enum { UISAVESLOT_REGULAR = 0, UISAVESLOT_NOSAVE = 1 } UISaveSlotTypes;
          typedef struct { RSDK_OBJECT uint16 aniFrames; } ObjectUISaveSlot;
          typedef struct {
              RSDK_ENTITY
              StateMachine(state); StateMachine(stateDraw);
              int32 type; int32 slotID; int32 listID; int32 frameID;
              int32 saveZoneID; int32 saveLives; int32 saveContinues; int32 saveEmeralds;
              bool32 isNewSave; bool32 isEncoreSave; bool32 isSelected; bool32 currentlySelected;
              int32 dpadAlpha; int32 slotNumAlpha; int32 zoneNameAlpha; int32 buttonID;
              Vector2 startPos; Vector2 size; int32 textBounceOffset; int32 textBounceVel;
              int32 unused1; int32 unused2; int32 unused3; int32 unused4;
              Animator uiAnimator; Animator playersAnimator; Animator shadowsAnimator;
              Animator livesAnimator; Animator continuesAnimator; Animator emeraldsAnimator;
              Animator zoneNameAnimator; Animator textAnimator; Animator dpadAnimator;
              int32 unused5; void *parent; String text; int32 fxRuby; int32 unused6; int32 unused7;
          } EntityUISaveSlot;
          extern ObjectUISaveSlot *UISaveSlot;
          bool32 UISaveSlot_State_Selected_Hook(bool32 skipped);
          bool32 UISaveSlot_SetupButtonElements_Hook(bool32 skipped);
          void SaveEditor_OnDraw(void *data);
          #endif
          EOF

          cat << 'EOF' > SaveEditorMod/Objects/UISaveSlot.c
          #include "UISaveSlot.h"
          ObjectUISaveSlot *UISaveSlot;
          bool32 editingSave = false; int32 editSlot = 0;
          int32 editSelection = 0; bool32 editIsEncore = false;
          SaveDataFile saveDataCache;
          void SaveData_SaveCB(int32 status) { (void)status; }
          void SaveData_LoadCB(int32 status) { (void)status; }

          static const uint8 FONT5X7_ROWS = {
              0,0,0,0,0,0,0,
              0x0E,0x11,0x13,0x15,0x19,0x11,0x0E,
              0x04,0x0C,0x04,0x04,0x04,0x04,0x0E,
              0x0E,0x11,0x01,0x02,0x04,0x08,0x1F,
              0x1F,0x02,0x04,0x02,0x01,0x11,0x0E,
              0x02,0x06,0x0A,0x12,0x1F,0x02,0x02,
              0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E,
              0x06,0x08,0x10,0x1E,0x11,0x11,0x0E,
              0x1F,0x01,0x02,0x04,0x08,0x08,0x08,
              0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E,
              0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C,
              0x0E,0x11,0x11,0x1F,0x11,0x11,0x11,
              0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E,
              0x0E,0x11,0x10,0x10,0x10,0x11,0x0E,
              0x1C,0x12,0x11,0x11,0x11,0x12,0x1C,
              0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F,
              0x1F,0x10,0x10,0x1E,0x10,0x10,0x10,
              0x0E,0x11,0x10,0x17,0x11,0x11,0x0F,
              0x11,0x11,0x11,0x1F,0x11,0x11,0x11,
              0x0E,0x04,0x04,0x04,0x04,0x04,0x0E,
              0x07,0x02,0x02,0x02,0x02,0x12,0x0C,
              0x11,0x12,0x14,0x18,0x14,0x12,0x11,
              0x10,0x10,0x10,0x10,0x10,0x10,0x1F,
              0x11,0x1B,0x15,0x15,0x11,0x11,0x11,
              0x11,0x11,0x19,0x15,0x13,0x11,0x11,
              0x0E,0x11,0x11,0x11,0x11,0x11,0x0E,
              0x1E,0x11,0x11,0x1E,0x10,0x10,0x10,
              0x0E,0x11,0x11,0x11,0x15,0x12,0x0D,
              0x1E,0x11,0x11,0x1E,0x14,0x12,0x11,
              0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E,
              0x1F,0x04,0x04,0x04,0x04,0x04,0x04,
              0x11,0x11,0x11,0x11,0x11,0x11,0x0E,
              0x11,0x11,0x11,0x11,0x11,0x0A,0x04,
              0x11,0x11,0x11,0x15,0x15,0x1B,0x11,
              0x11,0x11,0x0A,0x04,0x0A,0x11,0x11,
              0x11,0x11,0x0A,0x04,0x04,0x04,0x04,
              0x1F,0x01,0x02,0x04,0x08,0x10,0x1F,
              0x00,0x00,0x00,0x00,0x00,0x04,0x04,
              0x00,0x04,0x04,0x00,0x04,0x04,0x00,
              0x08,0x04,0x02,0x01,0x02,0x04,0x08,
              0x01,0x02,0x02,0x04,0x08,0x08,0x10
          };

          static int32 GlyphIndex(char c) {
              if (c >= '0' && c <= '9') return 1 + (c - '0');
              if (c >= 'A' && c <= 'Z') return 11 + (c - 'A');
              if (c >= 'a' && c <= 'z') return 11 + (c - 'a');
              if (c == '.') return 37;
              if (c == ':') return 38;
              if (c == '>') return 39;
              if (c == '/') return 40;
              return 0;
          }

          static void DrawPixText(int32 x, int32 y, const char *str, uint32 color) {
              int32 cx = x;
              for (int32 i = 0; str[i] != 0; ++i) {
                  int32 idx = GlyphIndex(str[i]);
                  for (int32 r = 0; r < 7; ++r) {
                      uint8 bits = FONT5X7_ROWS[idx * 7 + r];
                      for (int32 col = 0; col < 5; ++col) {
                          if (bits & (1 << (4 - col)))
                              RSDK.DrawRect(cx + col, y + r, 1, 1, color, 255, INK_NONE, true);
                      }
                  }
                  cx += 6;
              }
          }

          static void IntToStrPad(int32 val, int32 digits, char *out) {
              if (val < 0) val = 0;
              for (int32 i = digits - 1; i >= 0; --i) {
                  out[i] = '0' + (val % 10);
                  val /= 10;
              }
              out[digits] = 0;
          }
          EOF          cat << 'EOF' >> SaveEditorMod/Objects/UISaveSlot.c
          void SaveEditor_OnDraw(void *data) {
              (void)data;
              if (!editingSave) return;
              SaveRAM *saveRAM = &saveDataCache.slots[editSlot + (editIsEncore ? 8 : 0)];
              int32 bx = 8, by = 8, bw = 188, bh = 104;
              RSDK.DrawRect(bx, by, bw, bh, 0x000000, 210, INK_ALPHA, true);
              RSDK.DrawRect(bx, by, bw, 1, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx, by + bh - 1, bw, 1, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx, by, 1, bh, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx + bw - 1, by, 1, bh, 0xFFFFFF, 255, INK_NONE, true);

              DrawPixText(bx + 6, by + 5, "SAVE EDITOR", 0x00E0FF);

              const char *charNames = { "NONE", "SONIC", "TAILS", "KNUX", "MIGHTY", "RAY" };
              const char *zoneNames = {
                  "GHZ", "CPZ", "SPZ", "FBZ", "PGZ", "SSZ", "HCZ",
                  "MSZ", "OOZ", "LRZ", "MMZ", "TMZ", "ERZ"
              };
              const uint32 emColors = {
                  0x00FF00, 0x0080FF, 0xFF0000, 0xFF00FF,
                  0xFFFF00, 0x00FFFF, 0xE0E0E0
              };

              char valBuf;
              int32 emCount = 0;
              for (int32 i = 0; i < 7; ++i)
                  if (saveRAM->chaosEmeralds & (1 << i)) emCount++;

              for (int32 row = 0; row < 7; ++row) {
                  int32 ry = by + 17 + row * 12;
                  bool32 sel = (editSelection == row);
                  uint32 col = sel ? 0xFFFF00 : 0xFFFFFF;
                  if (sel) {
                      RSDK.DrawRect(bx + 3, ry - 1, bw - 6, 9, 0x303060, 200, INK_ALPHA, true);
                      DrawPixText(bx + 5, ry, ">", 0xFFFF00);
                  }
                  if (row == 0) {
                      DrawPixText(bx + 13, ry, "1.CHAR:", col);
                      int32 cid = saveRAM->characterID;
                      if (cid < 0 || cid > 5) cid = 1;
                      DrawPixText(bx + 76, ry, editIsEncore ? "ENCORE" : charNames[cid], col);
                  } else if (row == 1) {
                      DrawPixText(bx + 13, ry, "2.ZONE:", col);
                      int32 zid = saveRAM->zoneID;
                      if (zid < 0 || zid > 12) zid = 0;
                      DrawPixText(bx + 76, ry, zoneNames[zid], col);
                      if (saveRAM->saveState == SAVEFILE_COMPLETE)
                          DrawPixText(bx + 102, ry, "CLEAR", 0x00FF80);
                  } else if (row == 2) {
                      DrawPixText(bx + 13, ry, "3.LIVES:", col);
                      IntToStrPad(saveRAM->lives, 2, valBuf);
                      DrawPixText(bx + 76, ry, valBuf, col);
                  } else if (row == 3) {
                      DrawPixText(bx + 13, ry, "4.CONT:", col);
                      IntToStrPad(saveRAM->continues, 2, valBuf);
                      DrawPixText(bx + 76, ry, valBuf, col);
                  } else if (row == 4) {
                      DrawPixText(bx + 13, ry, "5.SCORE:", col);
                      IntToStrPad(saveRAM->score, 7, valBuf);
                      DrawPixText(bx + 76, ry, valBuf, col);
                  } else if (row == 5) {
                      DrawPixText(bx + 13, ry, "6.EMERALD:", col);
                      valBuf = '0' + emCount; valBuf = '/';
                      valBuf = '7'; valBuf = 0;
                      DrawPixText(bx + 76, ry, valBuf, col);
                      for (int32 e = 0; e < 7; ++e) {
                          uint32 ec = (saveRAM->chaosEmeralds & (1 << e)) ? emColors[e] : 0x404040;
                          RSDK.DrawRect(bx + 100 + e * 10, ry, 7, 7, ec, 255, INK_NONE, true);
                      }
                  } else if (row == 6) {
                      DrawPixText(bx + 13, ry, "7.SAVE EXIT", sel ? 0x00FF80 : 0xA0FFA0);
                  }
              }
          }
          EOF
          cat << 'EOF' >> SaveEditorMod/Objects/UISaveSlot.c
          bool32 UISaveSlot_State_Selected_Hook(bool32 skipped) {
              (void)skipped;
              RSDK_THIS(UISaveSlot);
              if (self->type == UISAVESLOT_REGULAR && !self->isNewSave) {
                  bool32 touched = false;
                  if (TouchInfo->count) {
                      int32 sx = ScreenInfo[SceneInfo->currentScreenID].size.x;
                      int32 sy = ScreenInfo[SceneInfo->currentScreenID].size.y;
                      for (int32 t = 0; t < TouchInfo->count; ++t) {
                          int32 tx = (int32)(TouchInfo->x[t] * sx);
                          int32 ty = (int32)(TouchInfo->y[t] * sy);
                          if (TouchInfo->down[t] && tx >= 0 && ty >= sy - 32 && tx <= 32 && ty <= sy) {
                              touched = true; break;
                          }
                      }
                  }
                  static bool32 prevTouch = false;
                  bool32 touchPress = touched && !prevTouch; prevTouch = touched;
                  bool32 rbPress = TriggerInfoR[CONT_ANY].keyBumper.press;

                  if (!editingSave) {
                      if (rbPress || touchPress) {
                          API.LoadUserFile("SaveData.bin", &saveDataCache, sizeof(SaveDataFile), SaveData_LoadCB);
                          editingSave = true; editSlot = self->slotID;
                          editIsEncore = self->isEncoreSave; editSelection = 0;
                          RSDK.PlaySfx(RSDK.GetSfx("Global/MenuMove.wav"), false, 255);
                          return true;
                      }
                      return false;
                  } else {
                      SaveRAM *saveRAM = &saveDataCache.slots[self->slotID + (self->isEncoreSave ? 8 : 0)];
                      bool32 confirmExit = (editSelection == 6) && (
                          ControllerInfo[CONT_ANY].keyA.press ||
                          ControllerInfo[CONT_ANY].keyLeft.press ||
                          ControllerInfo[CONT_ANY].keyRight.press
                      );
                      if (ControllerInfo[CONT_ANY].keyB.press || rbPress || touchPress || confirmExit) {
                          editingSave = false;
                          API.SaveUserFile("SaveData.bin", &saveDataCache, sizeof(SaveDataFile), SaveData_SaveCB, false);
                          RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBack.wav"), false, 255);
                          return true;
                      }
                      if (ControllerInfo[CONT_ANY].keyUp.press) {
                          if (--editSelection < 0) editSelection = 6;
                          RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
                      } else if (ControllerInfo[CONT_ANY].keyDown.press) {
                          if (++editSelection > 6) editSelection = 0;
                          RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
                      }

                      int32 dir = ControllerInfo[CONT_ANY].keyRight.press ? 1
                                : (ControllerInfo[CONT_ANY].keyLeft.press ? -1 : 0);
                      if (dir) {
                          if (editSelection == 0) {
                              if (!self->isEncoreSave) {
                                  uint8 m = API.CheckDLC(DLC_PLUS) ? 5 : 3;
                                  if (dir > 0) { if (++saveRAM->characterID > m) saveRAM->characterID = 1; }
                                  else { if (--saveRAM->characterID < 1) saveRAM->characterID = m; }
                              } else {
                                  uint8 lst = { saveRAM->playerID & 0xFF, (saveRAM->playerID >> 8) & 0xFF, saveRAM->stock };
                                  uint8 cnt = 0;
                                  for (int32 i = 0; i < 3; ++i) if (lst[i]) cnt++;
                                  if (cnt > 1) {
                                      uint8 prv = lst;
                                      for (int32 i = 0; i < cnt - 1; ++i) lst[i] = lst[i + 1];
                                      lst[cnt - 1] = prv;
                                      saveRAM->playerID = (lst << 0) | (lst << 8);
                                      saveRAM->stock = lst;
                                  }
                              }
                          } else if (editSelection == 1) {
                              int32 zm = (!self->isEncoreSave && (
                                  saveRAM->characterID == 1 ||
                                  saveRAM->characterID == 4 ||
                                  saveRAM->characterID == 5)) ? ZONE_ERZ : ZONE_TMZ;
                              if (dir > 0) {
                                  if (++saveRAM->zoneID > zm) {
                                      saveRAM->zoneID = ZONE_GHZ; saveRAM->saveState = SAVEFILE_REGULAR;
                                  } else if (saveRAM->zoneID == zm) saveRAM->saveState = SAVEFILE_COMPLETE;
                              } else {
                                  if (saveRAM->zoneID == zm) {
                                      if (saveRAM->saveState == SAVEFILE_COMPLETE) saveRAM->saveState = SAVEFILE_REGULAR;
                                      else saveRAM->zoneID--;
                                  } else if (--saveRAM->zoneID >= ZONE_MAX) {
                                      saveRAM->zoneID = zm; saveRAM->saveState = SAVEFILE_COMPLETE;
                                  }
                              }
                              self->saveZoneID = saveRAM->zoneID;
                          } else if (editSelection == 2) {
                              int32 lv = (int32)saveRAM->lives + dir;
                              if (lv < 1) lv = 99; else if (lv > 99) lv = 1;
                              saveRAM->lives = (uint8)lv;
                              self->saveLives = saveRAM->lives;
                          } else if (editSelection == 3) {
                              int32 ct = (int32)saveRAM->continues + dir;
                              if (ct < 0) ct = 99; else if (ct > 99) ct = 0;
                              saveRAM->continues = (uint8)ct;
                              self->saveContinues = saveRAM->continues;
                          } else if (editSelection == 4) {
                              int32 sc = (int32)saveRAM->score + dir * 10000;
                              if (sc < 0) sc = 9990000; else if (sc > 9999990) sc = 0;
                              saveRAM->score = sc;
                          } else if (editSelection == 5) {
                              int32 em = 0;
                              for (int32 i = 0; i < 7; ++i)
                                  if (saveRAM->chaosEmeralds & (1 << i)) em++;
                              em += dir;
                              if (em < 0) em = 7; else if (em > 7) em = 0;
                              saveRAM->chaosEmeralds = 0;
                              for (int32 i = 0; i < em; ++i)
                                  saveRAM->chaosEmeralds |= (1 << i);
                              self->saveEmeralds = saveRAM->chaosEmeralds;
                          }
                          RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
                          if (saveRAM->saveState == SAVEFILE_COMPLETE) self->frameID = 14;
                          else {
                              self->frameID = self->saveZoneID + 1;
                              if (self->isEncoreSave && self->saveZoneID >= ZONE_MSZ) self->frameID--;
                              if (self->saveZoneID == ZONE_ERZ) self->frameID = 13;
                          }
                          UISaveSlot_SetupButtonElements_Hook(false);
                      }
                      return true;
                  }
              }
              return false;
          }

          bool32 UISaveSlot_SetupButtonElements_Hook(bool32 skipped) {
              (void)skipped;
              RSDK_THIS(UISaveSlot);
              if (self->type == UISAVESLOT_REGULAR && !self->isNewSave && editingSave) {
                  SaveRAM *saveRAM = &saveDataCache.slots[self->slotID + (self->isEncoreSave ? 8 : 0)];
                  RSDK.SetSpriteAnimation(UISaveSlot->aniFrames, 1, &self->playersAnimator, true, saveRAM->characterID);
                  RSDK.SetSpriteAnimation(UISaveSlot->aniFrames, 2, &self->shadowsAnimator, true, saveRAM->characterID);
                  int32 lives = 0;
                  if (self->isEncoreSave) {
                      if (saveRAM->playerID & 0xFF) lives++;
                      if (saveRAM->playerID >> 8) lives++;
                      for (int32 i = 0; i < 3; ++i) if ((saveRAM->stock >> i) & 1) lives++;
                  } else lives = saveRAM->lives;
                  self->saveLives = lives;
                  RSDK.SetSpriteAnimation(UISaveSlot->aniFrames, 3, &self->livesAnimator, true, saveRAM->characterID - 1);
                  RSDK.SetSpriteAnimation(UISaveSlot->aniFrames, 4, &self->continuesAnimator, true, saveRAM->characterID - 1);
              }
              return false;
          }
          EOF
          python3 -c '
          lb, rb = chr(91), chr(93)
          gp = "SaveEditorMod/Objects/GameProgress.h"
          sg = "SaveEditorMod/Objects/SaveGame.h"
          ui = "SaveEditorMod/Objects/UISaveSlot.c"
          reps = [
              (gp, "unlockedStages;", f"unlockedStages{lb}32{rb};"),
              (sg, "SaveRAM slots;\n    uint8 padding_end;",
                   f"SaveRAM slots{lb}16{rb};\n    uint8 padding{lb}0x1000{rb};"),
              (ui, "const uint8 FONT5X7_ROWS = {",
                   f"const uint8 FONT5X7_ROWS{lb}41 * 7{rb} = {{"),
              (ui, "const char *charNames = {",
                   f"const char *charNames{lb}6{rb} = {{"),
              (ui, "const char *zoneNames = {",
                   f"const char *zoneNames{lb}13{rb} = {{"),
              (ui, "const uint32 emColors = {",
                   f"const uint32 emColors{lb}7{rb} = {{"),
              (ui, "char valBuf;", f"char valBuf{lb}16{rb};"),
              (ui, "valBuf = \x270\x27 + emCount; valBuf = \x27/\x27;",
                   f"valBuf{lb}0{rb} = \x270\x27 + emCount; valBuf{lb}1{rb} = \x27/\x27;"),
              (ui, "valBuf = \x277\x27; valBuf = 0;",
                   f"valBuf{lb}2{rb} = \x277\x27; valBuf{lb}3{rb} = 0;"),
              (ui, "uint8 lst = {", f"uint8 lst{lb}3{rb} = {{"),
              (ui, "prv = lst;", f"prv = lst{lb}0{rb};"),
              (ui, "(lst << 0) | (lst << 8);",
                   f"(lst{lb}0{rb} << 0) | (lst{lb}1{rb} << 8);"),
              (ui, "saveRAM->stock = lst;", f"saveRAM->stock = lst{lb}2{rb};"),
          ]
          for path, old, new in reps:
              s = open(path).read()
              assert old in s, f"Missing {old} in {path}"
              open(path, "w").write(s.replace(old, new, 1))
          '

          cat << 'EOF' > SaveEditorMod/dllmain.c
          #include "GameAPI/Game.h"
