name: Verify Input Loop and UISaveSlot Symbols

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Check SDL2InputDevice and UISaveSlot
        run: |
          echo "=== 1. SDL2InputDevice.cpp ==="
          nl -ba RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp
          echo "=== 2. UserCore.cpp KeyMaps ==="
          grep -rn -C 15 "defaultKeyMaps" RSDKv5/RSDK/User/Core/UserCore.cpp
          echo "=== 3. UISaveSlot Public Funcs ==="
          find Game -iname "*UISaveSlot*" -exec grep -rn -C 10 "ADD_PUBLIC_FUNC\|UISaveSlot_State_Selected" {} + || true
