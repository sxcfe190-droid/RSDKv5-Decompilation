name: Check FindObject and foreach_all

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Print FindObject and foreach_all in GameLink.h
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          grep -rn -C 15 "foreach_all\|FindObject\|GetAllEntities" GAPI/C/GameAPI/
