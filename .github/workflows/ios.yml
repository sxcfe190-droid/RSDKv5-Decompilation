name: Inspect iOS AVAudioSession Code
on:
  workflow_dispatch:
jobs:
  inspect-audio:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print All AVAudioSession & Audio Hint References
        run: |
          echo "=== 1. AVAudioSession in RSDKv5/ ==="
          grep -rn -C 8 -E "AVAudioSession|SDL_HINT_AUDIO_CATEGORY" RSDKv5/ || true

          echo "=== 2. AVAudioSession in dependencies/ios/SDL/ ==="
          grep -rn -C 10 -E "AVAudioSession|SDL_HINT_AUDIO_CATEGORY" dependencies/ios/SDL/ || true
