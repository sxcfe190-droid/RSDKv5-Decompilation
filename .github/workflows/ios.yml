name: Inspect GameLink

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Print GameLink.h
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          cat GAPI/C/GameAPI/GameLink.h
