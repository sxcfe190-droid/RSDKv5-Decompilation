name: Inspect SDL2InputDevice Full
on:
  workflow_dispatch:
jobs:
  inspect-sdl:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"

      - name: Print SDL2InputDevice.cpp
        run: |
          nl -ba RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp | sed -n '1,160p'
