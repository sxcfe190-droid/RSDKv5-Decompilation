name: Inspect RSDK Draw Functions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Print RSDK Draw Functions in GameLink.h
        run: |
          GH="github.com"
          REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${REPO}.git" GAPI
          grep -rn -i "Draw" GAPI/C/GameAPI/GameLink.h || true
