name: Inspect RSDKv5 iOS Source
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive
      - name: Inspect Source
        run: |
          echo "=== ModAPI ==="
          grep -rn "mods" RSDKv5/RSDK/
          echo "=== Audio ==="
          ls -la RSDKv5/RSDK/Audio/
          head -n 60 RSDKv5/RSDK/Audio/Audio.cpp
          echo "=== DevMenu Mods ==="
          grep -rn -C 5 "Mods" RSDKv5/RSDK/Dev/
          echo "=== Xcode Preprocessor ==="
          grep -rn "GCC_PREPROCESSOR_DEFINITIONS" RSDKv5.xcodeproj/
