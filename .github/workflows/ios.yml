name: Check Game Plus Definitions
on:
  workflow_dispatch:
jobs:
  check-plus:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print Game Plus Preprocessor & Header
        run: |
          echo "=== 1. Game/SonicMania.xcodeproj Preprocessor Definitions ==="
          grep -n -C 5 "GCC_PREPROCESSOR_DEFINITIONS" Game/SonicMania.xcodeproj/project.pbxproj || true
          echo "=== 2. MANIA_USE_PLUS in Game/ source ==="
          grep -rn -C 5 "MANIA_USE_PLUS" Game/ || true
          echo "=== 3. CheckDLC in Game/ source ==="
          grep -rn -C 3 "CheckDLC" Game/ | head -n 60 || true
