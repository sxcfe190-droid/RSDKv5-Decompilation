name: Deep Inspect PauseMenu and UI Font

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Inspect PauseMenu and UIWidgets Font
        run: |
          echo "=== 1. PauseMenu Spawn & keyStart ==="
          grep -rn -C 12 "PauseMenu" Game/ || true
          echo "=== 2. UIWidgets Font ==="
          grep -rn -C 8 "UIWidgets.bin" Game/ || true
          echo "=== 3. Encore Switch in Game ==="
          grep -rn -C 15 "Encore Mode" Game/ || true
