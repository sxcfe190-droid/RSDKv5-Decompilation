name: Check SaveEditor Source

on:
  workflow_dispatch:

jobs:
  check_mod:
    runs-on: macos-latest
    steps:
      - name: Clone & Inspect SaveEditor
        run: |
          git clone --recursive https://github.com SaveEditor
          find SaveEditor -maxdepth 3 -not -path '*/.*'
          echo "=== CMakeLists.txt ==="
          cat SaveEditor/CMakeLists.txt
          echo "=== Source Files ==="
          head -n 80 SaveEditor/SaveEditor/*
