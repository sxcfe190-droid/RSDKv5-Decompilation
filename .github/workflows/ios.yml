name: Inspect SDL2InputDevice UpdateInput Exact Lines
on:
  workflow_dispatch:
jobs:
  inspect-exact:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"

      - name: Print SDL2InputDevice.cpp lines 1 to 130
        run: |
          nl -ba RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp | sed -n '1,130p'
