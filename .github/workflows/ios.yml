name: Inspect RSDK DrawText and UISaveSlot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Print RSDK Draw Functions
        run: |
          grep -rn -C 5 "DrawRect\|DrawText\|LoadFont\|SetSpriteString" RSDKv5/RSDK/Core/ModAPI.hpp
