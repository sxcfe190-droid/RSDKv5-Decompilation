name: Check SaveEditor Source

on:
  workflow_dispatch:

jobs:
  check_mod:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mania-Decomp-Mods/SaveEditor
          submodules: recursive
          path: SaveEditor

      - name: Inspect SaveEditor Files
        run: |
          find SaveEditor -maxdepth 3 -not -path '*/.*'
          echo "=== CMakeLists.txt ==="
          cat SaveEditor/CMakeLists.txt
          echo "=== Header/Source check ==="
          head -n 60 SaveEditor/SaveEditor/*
