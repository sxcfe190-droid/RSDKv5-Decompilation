name: Build RSDKv5 iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Setup Game symlink
        run: |
          rm -rf Game
          ln -s "$PWD/Sonic-Mania-Decompilation" "$PWD/Game"

      - name: Configure CMake for iOS
        run: |
          cmake -B build_ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/platforms/iOS.cmake" \
            -DRETRO_REVISION=2 \
            -DRETRO_MOD_LOADER=ON

      - name: Build iOS App
        run: |
          cmake --build build_ios --config Release -- \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          find build_ios -name "*.app" -exec cp -r {} Payload/ \;
          zip -r RSDKv5-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-IPA
          path: RSDKv5-iOS.ipa
