name: Build RSDKv5 iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout WamWooWam iOS Fork
        uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Setup Game symlink
        run: |
          rm -rf Game
          ln -s "$PWD/Sonic-Mania-Decompilation" "$PWD/Game"

      - name: Fix SDL Target Ambiguity
        run: |
          sed -i '' 's/name = Framework;/name = Framework-macOS;/g' dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj/project.pbxproj

      - name: Build iOS App
        run: |
          xcodebuild -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_MOD_LOADER=1 RETRO_REVISION=2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build_out/*.app Payload/
          zip -r RSDKv5-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-IPA
          path: RSDKv5-iOS.ipa
