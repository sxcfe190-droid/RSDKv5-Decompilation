name: Inspect LoadMod Body

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Print ModAPI.cpp 551-820
        run: |
          nl -ba RSDKv5/RSDK/Core/ModAPI.cpp | sed -n '551,820p'
