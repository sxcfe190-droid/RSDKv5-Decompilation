name: Fact Check Real iOS Input
on:
  workflow_dispatch:
jobs:
  fact-check-input:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print Real Active Input & B/X Debug Keys
        run: |
          echo "=== 1. Check how Input.cpp includes platform input ==="
          nl -ba RSDKv5/RSDK/Input/Input.cpp | sed -n '1,80p'

          echo "=== 2. Check all files referencing SDL_GameController or GCController ==="
          grep -rn -C 5 -E "SDL_GameController|SDL_Joystick|GCController|RETRO_INPUT" RSDKv5/ || true

          echo "=== 3. Check RetroEngine.cpp devMenu / B / X / step / freeze keys ==="
          nl -ba RSDKv5/RSDK/Core/RetroEngine.cpp | sed -n '1370,1470p'
