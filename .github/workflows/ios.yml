name: Print SDL2InputDevice Source

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Print SDL2InputDevice.cpp
        run: |
          cat RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp
