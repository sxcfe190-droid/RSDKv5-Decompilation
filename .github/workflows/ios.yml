name: Check Xcode Target Sources
on:
  workflow_dispatch:
jobs:
  check-xcode:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print Xcode Compiled Input & Engine Files
        run: |
          echo "=== 1. Xcode project.pbxproj Input & Engine references ==="
          grep -n -E "InputDevice|RetroEngine|UserCore|ModAPI" RSDKv5.xcodeproj/project.pbxproj
          echo "=== 2. Xcode Preprocessor Definitions ==="
          grep -n -C 5 "GCC_PREPROCESSOR_DEFINITIONS" RSDKv5.xcodeproj/project.pbxproj
          echo "=== 3. All SDL2InputDevice.cpp locations ==="
          find . -name "SDL2InputDevice.cpp"
          echo "=== 4. All RetroEngine.cpp locations ==="
          find . -name "RetroEngine.cpp"
