name: Fact Check iOS SDL MFi Mapping
on:
  workflow_dispatch:
jobs:
  check-mfi:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print iOS SDL MFi Button Mapping Source
        run: |
          echo "=== SDL_mfijoystick.m GCExtendedGamepad / MFi button mapping ==="
          grep -n -C 15 -E "buttonOptions|buttonMenu|buttonHome|SDL_CONTROLLER_BUTTON_BACK|SDL_CONTROLLER_BUTTON_START" dependencies/ios/SDL/src/joystick/iphoneos/SDL_mfijoystick.m || true
