name: Inspect LoadMod and Debug Mods Toggle

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Print ModAPI.cpp 261-550 and Debug.cpp
        run: |
          echo "=== ModAPI.cpp 261-550 ==="
          nl -ba RSDKv5/RSDK/Core/ModAPI.cpp | sed -n '261,550p'
          echo "=== Debug.cpp Mods Menu ==="
          grep -rn -C 25 "MANAGE MODS\|LoadMod(" RSDKv5/RSDK/Dev/Debug.cpp
