          static void DrawKoStr(int32 x, int32 y, const char *utf8) {
              const uint8 *p = (const uint8 *)utf8;
              int32 cx = x;
              while (*p) {
                  if (*p < 0x80) {
                      char c = (char)*p++;
                      int32 di = -1;
                      if (c >= '0' && c <= '9') di = c - '0';
                      else if (c == ':') di = 10;
                      else if (c == '+') di = 11;
                      if (di >= 0) {
                          for (int32 col = 0; col < 5; ++col) {
                              uint8 bits = dig5x7[di][col];
                              for (int32 r = 0; r < 7; ++r)
                                  if (bits & (1 << r))
                                      RSDK.DrawRect(cx + col, y + r + 1, 2, 1, 0xFFFFFF, 255, INK_NONE, true);
                          }
                          cx += 7;
                      } else cx += 4;
                  } else if ((*p & 0xE0) == 0xE0 && p && p) {
                      uint16 u = ((p & 0x0F) << 12) | ((p & 0x3F) << 6) | (p & 0x3F);
                      p += 3;
                      int32 cnt = (int32)(sizeof(koFont) / sizeof(koFont));
                      for (int32 k = 0; k < cnt; ++k) {
                          if (koFont[k].code == u) {
                              for (int32 r = 0; r < 8; ++r) {
                                  uint8 rowb = koFont[k].rows[r];
                                  for (int32 col = 0; col < 8; ++col)
                                      if (rowb & (0x80 >> col))
                                          RSDK.DrawRect(cx + col, y + r, 2, 1, 0xFFFFFF, 255, INK_NONE, true);
                              }
                              break;
                          }
                      }
                      cx += 10;
                  } else p++;
              }
          }

          void SaveEditor_OnDraw(void *data) {
              (void)data;
              if (!editingSave) return;
              SaveRAM *liveSlots = (SaveRAM *)Mod.GetGlobals();
              SaveRAM *saveRAM = liveSlots ? &liveSlots[editSlot] : &saveDataCache.slots[editSlot];
              int32 bx = 6, by = 6, bw = 196, bh = 148;
              RSDK.DrawRect(bx, by, bw, bh, 0xE86A17, 242, INK_ALPHA, true);
              RSDK.DrawRect(bx, by, bw, 1, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx, by + bh - 1, bw, 1, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx, by, 1, bh, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx + bw - 1, by, 1, bh, 0xFFFFFF, 255, INK_NONE, true);
              RSDK.DrawRect(bx + 3, by + 5 + editSelection * 17, bw - 6, 15, 0x9E3800, 235, INK_ALPHA, true);

              const char *chars = {
                  "없음", "소닉+테일즈", "소닉", "테일즈", "너클즈", "마이티", "레이"
              };
              const char *zones = {
                  "그린힐", "케미컬", "스튜디오", "플라잉", "프레스",
                  "스타더스트", "하이드로", "미라지", "오일오션", "라바리프",
                  "메탈릭", "타이타닉", "에그레버리", "올클리어"
              };
              int32 cIdx = saveRAM->characterID <= 6 ? saveRAM->characterID : 0;
              int32 zIdx = (saveRAM->saveState == SAVEFILE_COMPLETE) ? 13 : (saveRAM->zoneID <= 12 ? saveRAM->zoneID : 0);
              int32 emCnt = 0;
              for (int32 i = 0; i < 7; ++i) if (saveRAM->chaosEmeralds & (1 << i)) emCnt++;

              char buf;
              snprintf(buf, 64, "슬롯: %d %s", editSlot + 1, editSlot >= 8 ? "앙코르" : "매니아");
              snprintf(buf, 64, "캐릭터: %s", chars[cIdx]);
              snprintf(buf, 64, "스테이지: %s", zones[zIdx]);
              snprintf(buf, 64, "목숨: %d", saveRAM->lives);
              snprintf(buf, 64, "컨티뉴: %d", saveRAM->continues);
              snprintf(buf, 64, "점수: %d", saveRAM->score);
              snprintf(buf, 64, "에메랄드: %d", emCnt);
              snprintf(buf, 64, "저장 후 닫기");

              for (int32 i = 0; i < 8; ++i) {
                  DrawKoStr(bx + 8, by + 8 + i * 17, buf[i]);
              }
          }
          static void ClearMenuInputs(void) {
              for (int32 i = 0; i < 5; ++i) {
                  ControllerInfo[i].keyUp.press = false;
                  ControllerInfo[i].keyDown.press = false;
                  ControllerInfo[i].keyLeft.press = false;
                  ControllerInfo[i].keyRight.press = false;
                  ControllerInfo[i].keyA.press = false;
                  ControllerInfo[i].keyB.press = false;
                  ControllerInfo[i].keyStart.press = false;
              }
          }

          void SaveEditor_OnUpdate(void *data) {
              (void)data;
              if (SceneInfo->listCategory != 0) { editingSave = false; return; }

              bool32 touched = false;
              if (TouchInfo->count) {
                  int32 sx = ScreenInfo[SceneInfo->currentScreenID].size.x;
                  int32 sy = ScreenInfo[SceneInfo->currentScreenID].size.y;
                  for (int32 t = 0; t < TouchInfo->count; ++t) {
                      int32 tx = (int32)(TouchInfo->x[t] * sx);
                      int32 ty = (int32)(TouchInfo->y[t] * sy);
                      if (TouchInfo->down[t] && tx >= 0 && ty >= sy - 32 && tx <= 32 && ty <= sy) { touched = true; break; }
                  }
              }
              static bool32 prevTouch = false;
              bool32 touchPress = touched && !prevTouch; prevTouch = touched;
              bool32 rbPress = TriggerInfoR[CONT_ANY].keyBumper.press || TriggerInfoR[CONT_P1].keyBumper.press;

              SaveRAM *liveSlots = (SaveRAM *)Mod.GetGlobals();
              if (!editingSave) {
                  if (rbPress || touchPress) {
                      if (liveSlots) memcpy(saveDataCache.slots, liveSlots, sizeof(SaveRAM) * 16);
                      else API.LoadUserFile("SaveData.bin", &saveDataCache, sizeof(SaveDataFile), SaveData_LoadCB);
                      editingSave = true; editSelection = 0;
                      RSDK.PlaySfx(RSDK.GetSfx("Global/MenuMove.wav"), false, 255);
                  }
                  return;
              }

              SaveRAM *saveRAM = liveSlots ? &liveSlots[editSlot] : &saveDataCache.slots[editSlot];
              bool32 upP = ControllerInfo[CONT_ANY].keyUp.press;
              bool32 dnP = ControllerInfo[CONT_ANY].keyDown.press;
              bool32 ltP = ControllerInfo[CONT_ANY].keyLeft.press;
              bool32 rtP = ControllerInfo[CONT_ANY].keyRight.press;
              bool32 aP = ControllerInfo[CONT_ANY].keyA.press;
              bool32 bP = ControllerInfo[CONT_ANY].keyB.press;
              ClearMenuInputs();

              if ((editSelection == 7 && aP) || bP || rbPress || touchPress) {
                  editingSave = false;
                  if (liveSlots) memcpy(saveDataCache.slots, liveSlots, sizeof(SaveRAM) * 16);
                  API.SaveUserFile("SaveData.bin", &saveDataCache, sizeof(SaveDataFile), SaveData_SaveCB, false);
                  RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBack.wav"), false, 255);
                  return;
              }
              if (upP) {
                  if (--editSelection < 0) editSelection = 7;
                  RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
              } else if (dnP) {
                  if (++editSelection > 7) editSelection = 0;
                  RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
              }
              int32 dir = rtP ? 1 : (ltP ? -1 : 0);
              if (dir && editSelection < 7) {
                  if (editSelection == 0) {
                      editSlot += dir;
                      if (editSlot < 0) editSlot = 15;
                      else if (editSlot > 15) editSlot = 0;
                  } else {
                      if (saveRAM->saveState == SAVEFILE_EMPTY) {
                          saveRAM->saveState = SAVEFILE_REGULAR;
                          if (saveRAM->characterID == 0) saveRAM->characterID = 1;
                          if (saveRAM->lives == 0) saveRAM->lives = 3;
                      }
                      if (editSelection == 1) {
                          if (dir > 0) { if (++saveRAM->characterID > 5) saveRAM->characterID = 1; }
                          else { if (--saveRAM->characterID < 1) saveRAM->characterID = 5; }
                      } else if (editSelection == 2) {
                          int32 zm = (saveRAM->characterID == 1 || saveRAM->characterID == 4 || saveRAM->characterID == 5) ? 12 : 11;
                          if (dir > 0) { if (++saveRAM->zoneID > zm) { saveRAM->zoneID = 0; saveRAM->saveState = SAVEFILE_REGULAR; } else if (saveRAM->zoneID == zm) saveRAM->saveState = SAVEFILE_COMPLETE; }
                          else { if (saveRAM->zoneID == zm) { if (saveRAM->saveState == SAVEFILE_COMPLETE) saveRAM->saveState = SAVEFILE_REGULAR; else saveRAM->zoneID--; } else if (saveRAM->zoneID == 0) { saveRAM->zoneID = zm; saveRAM->saveState = SAVEFILE_COMPLETE; } else saveRAM->zoneID--; }
                      } else if (editSelection == 3) {
                          saveRAM->lives += dir; if (saveRAM->lives < 1) saveRAM->lives = 99; else if (saveRAM->lives > 99) saveRAM->lives = 1;
                      } else if (editSelection == 4) {
                          int32 c = (int32)saveRAM->continues + dir; if (c < 0) c = 99; else if (c > 99) c = 0;
                          saveRAM->continues = (uint8)c;
                      } else if (editSelection == 5) {
                          saveRAM->score += dir * 10000; if (saveRAM->score < 0) saveRAM->score = 9999990; else if (saveRAM->score > 9999990) saveRAM->score = 0;
                      } else if (editSelection == 6) {
                          int32 em = 0; for (int32 i = 0; i < 7; ++i) if (saveRAM->chaosEmeralds & (1 << i)) em++;
                          em += dir; if (em < 0) em = 7; else if (em > 7) em = 0;
                          saveRAM->chaosEmeralds = 0; for (int32 i = 0; i < em; ++i) saveRAM->chaosEmeralds |= (1 << i);
                      }
                  }
                  RSDK.PlaySfx(RSDK.GetSfx("Global/MenuBleep.wav"), false, 255);
              }
          }
          EOF
          python3 -c '
          lb, rb = chr(91), chr(93)
          reps = [
              ("SaveEditorMod/Objects/SaveGame.h", "SaveRAM slots;", f"SaveRAM slots{lb}16{rb};"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "dig5x7 = {", f"dig5x7{lb}12{rb}{lb}5{rb} = {{"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "uint8 rows;", f"uint8 rows{lb}8{rb};"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "koFont = {", f"koFont{lb}{rb} = {{"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "sizeof(koFont));", f"sizeof(koFont{lb}0{rb}));"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "&& p && p)", f"&& p{lb}1{rb} && p{lb}2{rb})"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "((p & 0x0F) << 12)", f"((p{lb}0{rb} & 0x0F) << 12)"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "((p & 0x3F) << 6)", f"((p{lb}1{rb} & 0x3F) << 6)"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "(p & 0x3F);", f"(p{lb}2{rb} & 0x3F);"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "const char *chars = {", f"const char *chars{lb}7{rb} = {{"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "const char *zones = {", f"const char *zones{lb}14{rb} = {{"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "char buf;", f"char buf{lb}8{rb}{lb}64{rb};"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"슬롯:", f"snprintf(buf{lb}0{rb}, 64, \"슬롯:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"캐릭터:", f"snprintf(buf{lb}1{rb}, 64, \"캐릭터:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"스테이지:", f"snprintf(buf{lb}2{rb}, 64, \"스테이지:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"목숨:", f"snprintf(buf{lb}3{rb}, 64, \"목숨:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"컨티뉴:", f"snprintf(buf{lb}4{rb}, 64, \"컨티뉴:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"점수:", f"snprintf(buf{lb}5{rb}, 64, \"점수:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"에메랄드:", f"snprintf(buf{lb}6{rb}, 64, \"에메랄드:"),
              ("SaveEditorMod/Objects/UISaveSlot.c", "snprintf(buf, 64, \"저장 후 닫기", f"snprintf(buf{lb}7{rb}, 64, \"저장 후 닫기"),
          ]
          for path, old, new in reps:
              s = open(path).read()
              assert old in s, f"Missing {old} in {path}"
              open(path, "w").write(s.replace(old, new))
          '

          cat << 'EOF' > SaveEditorMod/dllmain.c
          #include "GameAPI/Game.h"
          #include "Objects/SaveGame.h"
          #if RETRO_USE_MOD_LOADER
          DLLExport bool32 LinkModLogic(EngineInfo *info, const char *id);
          #endif
          void InitModAPI(void)
          {
              Mod.AddModCallback(MODCB_ONUPDATE, SaveEditor_OnUpdate);
              Mod.AddModCallback(MODCB_ONDRAW, SaveEditor_OnDraw);
          }
          #if RETRO_USE_MOD_LOADER
          bool32 LinkModLogic(EngineInfo *info, const char *id)
          {
          #if MANIA_USE_PLUS
              LinkGameLogicDLL(info);
          #else
              LinkGameLogicDLL(*info);
          #endif
              globals = Mod.GetGlobals();
              modID = id;
              InitModAPI();
              return true;
          }
          #endif
          EOF
          GH="github.com"
          GAPI_REPO="RSDKModding/RSDKv5-GameAPI"
          git clone --depth 1 "https://${GH}/${GAPI_REPO}.git" GameAPI_SDK

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build_out/SaveEditor.framework
          clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=13.0 \
            -dynamiclib -install_name "@rpath/SaveEditor.framework/SaveEditor" \
            -DRETRO_REVISION=3 -DRETRO_REV0U=1 -DRETRO_USE_MOD_LOADER=1 -DRETRO_MOD_LOADER_VER=2 \
            -DGAME_INCLUDE_EDITOR=1 -DMANIA_PREPLUS=0 -DMANIA_FIRST_RELEASE=0 \
            -DGAME_VERSION=5 -DGAME_TYPE=1 \
            -ISaveEditorMod -ISaveEditorMod/Objects -IGameAPI_SDK/C \
            GameAPI_SDK/C/GameAPI/Game.c SaveEditorMod/dllmain.c \
            SaveEditorMod/Objects/UISaveSlot.c \
            -o build_out/SaveEditor.framework/SaveEditor

          cat << 'EOF' > build_out/SaveEditor.framework/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>SaveEditor</string>
            <key>CFBundleIdentifier</key><string>com.mania.mods.SaveEditor</string>
            <key>CFBundleName</key><string>SaveEditor</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.2.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>13.0</string>
          </dict></plist>
          EOF

          mkdir -p Payload/RSDKv5.app/Frameworks
          cp -r build_out/RSDKv5.app Payload/
          find build_out -maxdepth 3 -name "*.framework" -exec cp -rn {} Payload/RSDKv5.app/Frameworks/ \;
          rm -rf Payload/RSDKv5.app/Frameworks/ManiaTouchControls.framework Payload/RSDKv5.app/Data/mods Payload/RSDKv5.app/mods
          DYLIB_SRC=$(find . -name "Game.dylib" | head -n 1)
          if [ -n "$DYLIB_SRC" ]; then
            cp "$DYLIB_SRC" Payload/RSDKv5.app/Frameworks/SonicMania
            install_name_tool -id "@rpath/SonicMania" Payload/RSDKv5.app/Frameworks/SonicMania
            rm -f Payload/RSDKv5.app/Frameworks/Game.dylib
          fi
          zip -r RSDKv5-iOS.ipa Payload

