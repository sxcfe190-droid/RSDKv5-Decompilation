name: Quick Check ModAPI iOS

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios
          path: RSDKv5

      - name: Check ModAPI Logic Load
        run: |
          grep -rn -C 15 "LinkModLogic\|dlopen\|LoadLibrary" RSDKv5/RSDKv5/
