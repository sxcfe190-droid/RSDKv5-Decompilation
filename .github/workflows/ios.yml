              );
              Mod.RegisterModCallback(MODCB_ONDRAW, SaveEditor_OnDraw);
          }
          #if RETRO_USE_MOD_LOADER
          bool32 LinkModLogic(EngineInfo *info, const char *id)
          {
          #if MANIA_USE_PLUS
              LinkGameLogicDLL(info);
          #else
              LinkGameLogicDLL(*info);
          #endif
              globals = Mod.GetGlobals();
