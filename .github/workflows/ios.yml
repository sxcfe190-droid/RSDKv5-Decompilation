name: Build RSDKv5 iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout WamWooWam iOS Fork
        uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Patch ModAPI to Documents & Setup Files
        run: |
          rm -rf Game
          ln -s "$PWD/Sonic-Mania-Decompilation" "$PWD/Game"
          sed -i '' 's/name = Framework;/name = Framework-macOS;/g' dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj/project.pbxproj
          
          # ModAPI.cpp에서 modPath를 아이패드 파일 앱 경로(userFilePath + "mods")로 변경
          python3 -c '
          p = "RSDKv5/RSDK/Core/ModAPI.cpp"
          with open(p, "r") as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              new_lines.append(line)
              if "mod_config" in line and "modPath.string()" in line:
                  pass
          code = "".join(lines)
          code = code.replace("modPath = fs::path(BASE_PATH)", "modPath = fs::path(userFilePath)")
          code = code.replace("modPath = BASE_PATH", "modPath = userFilePath")
          code = code.replace("Data/mods", "mods")
          with open(p, "w") as f:
              f.write(code)
          '
          grep -rn "modPath" RSDKv5/RSDK/Core/ModAPI.cpp | head -n 15

          cat << 'EOF' > RSDKv5/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.3.2</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Build RSDKv5 Engine
        run: |
          xcodebuild -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_MOD_LOADER=1 RETRO_REVISION=2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out"

      - name: Build SonicMania Game Logic
        run: |
          find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace"
          MANIA_PROJ=$(find Sonic-Mania-Decompilation -name "*.xcodeproj" | head -n 1)
          if [ -n "$MANIA_PROJ" ]; then
            xcodebuild -project "$MANIA_PROJ" \
              -alltargets \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              IPHONEOS_DEPLOYMENT_TARGET=13.0 \
              GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_MOD_LOADER=1 RETRO_REVISION=2' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build_out"
          else
            cmake -S Sonic-Mania-Decompilation -B build_mania -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DRETRO_MOD_LOADER=ON \
              -DRETRO_REVISION=2
            cmake --build build_mania --config Release -- \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build_out"
          fi

      - name: Package IPA with SonicMania Framework
        run: |
          mkdir -p Payload
          cp -r build_out/RSDKv5.app Payload/
          mkdir -p Payload/RSDKv5.app/Frameworks
          find build_out -name "*.framework" -exec cp -r {} Payload/RSDKv5.app/Frameworks/ \;
          ls -la Payload/RSDKv5.app/Frameworks/
          zip -r RSDKv5-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-IPA
          path: RSDKv5-iOS.ipa
