name: Deep Inspect Mod Loading Internals

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Inspect ModAPI, Link, and EngineInfo Internals
        run: |
          echo "=== 1. Link.hpp ==="
          cat RSDKv5/RSDK/Core/Link.hpp
          echo "=== 2. ModAPI.hpp ==="
          cat RSDKv5/RSDK/Core/ModAPI.hpp
          echo "=== 3. ModAPI.cpp (LoadMods & Activate) ==="
          nl -ba RSDKv5/RSDK/Core/ModAPI.cpp | sed -n '1,260p'
