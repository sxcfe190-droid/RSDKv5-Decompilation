name: Deep Inspect ABI and UISaveSlot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WamWooWam/RSDKv5-Decompilation
          ref: ios

      - name: Print Exact ABI and UISaveSlot Source
        run: |
          echo "=== 1. ModAPI.hpp ==="
          cat RSDKv5/RSDK/Core/ModAPI.hpp
          echo "=== 2. ControllerState Definition ==="
          grep -rn -A 35 "struct ControllerState" RSDKv5/RSDK/
          echo "=== 3. ModAPI.cpp EngineInfo Setup ==="
          grep -rn -B 5 -A 45 "LinkModLogic" RSDKv5/RSDK/Core/ModAPI.cpp
          echo "=== 4. UISaveSlot Original Source ==="
          find Game -iname "*UISaveSlot*" -exec head -n 120 {} +
