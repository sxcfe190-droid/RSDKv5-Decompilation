name: Inspect Game DevMenu Triggers
on:
  workflow_dispatch:
jobs:
  inspect-game-dv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Print All DevMenu Triggers in Game/ and RSDKv5/
        run: |
          echo "=== 1. DevMenu in Game/ ==="
          grep -rn -C 5 -i "DEVMENU" Game/ || true
          echo "=== 2. OpenDevMenu in RSDKv5/ ==="
          grep -rn -C 5 "OpenDevMenu" RSDKv5/ || true
