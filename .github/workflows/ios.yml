name: Inspect SDL2 & 2P Input Full
on:
  workflow_dispatch:
jobs:
  inspect-all:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"

      - name: Print All Input & SettingsINI Source
        run: |
          echo "=== 1. All Input Files ==="
          find RSDKv5/RSDK/Input -type f | sort
          echo "=== 2. SDL2InputDevice.cpp (161~end) ==="
          nl -ba RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp | sed -n '161,500p'
          echo "=== 3. SDL2RenderDevice.cpp Joystick/Controller ==="
          grep -n -C 8 -E "SDL_CONTROLLER|SDL_JOY|InitInput" RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp || true
          echo "=== 4. Input.cpp (1~155) ==="
          nl -ba RSDKv5/RSDK/Input/Input.cpp | sed -n '1,155p'
          echo "=== 5. UserCore.cpp defaultKeyMaps (290~375) ==="
          nl -ba RSDKv5/RSDK/User/Core/UserCore.cpp | sed -n '290,375p'
