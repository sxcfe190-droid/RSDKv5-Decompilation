name: Build RSDKv5 iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout WamWooWam iOS Fork
        uses: actions/checkout@v4
        with:
          repository: "WamWooWam/RSDKv5-Decompilation"
          ref: "ios"
          submodules: recursive

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Patch ModAPI to Documents & Setup Files
        run: |
          rm -rf Game
          ln -s "$PWD/Sonic-Mania-Decompilation" "$PWD/Game"
          sed -i '' 's/name = Framework;/name = Framework-macOS;/g' dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj/project.pbxproj
          
          # ModAPI.cpp 내의 실제 InitMods 부분 확인 및 userFilePath 강제 적용
          grep -n -C 5 "InitMods" RSDKv5/RSDK/Core/ModAPI.cpp || true
          python3 -c '
          p = "RSDKv5/RSDK/Core/ModAPI.cpp"
          with open(p, "r") as f:
              s = f.read()
          # modPath가 어디서 초기화되든 InitMods 시작 직후에 userFilePath + "mods"로 덮어쓰기
          target = "void Mod::InitMods()"
          if target in s:
              s = s.replace(target, target + "\n{\n    modPath = fs::path(userFilePath) / \"mods\";\n    fs::create_directories(modPath);\n" if target + "\n{" not in s else target)
              s = s.replace(target + "\n{", target + "\n{\n    modPath = fs::path(userFilePath) / \"mods\";\n    fs::create_directories(modPath);")
          with open(p, "w") as f:
              f.write(s)
          '

          cat << 'EOF' > RSDKv5/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.3.2</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Build RSDKv5 Engine
        run: |
          xcodebuild -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_MOD_LOADER=1 RETRO_REVISION=2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out"

      - name: Build SonicMania dylib for iOS
        run: |
          cmake -S Sonic-Mania-Decompilation -B build_mania \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRO_MOD_LOADER=ON \
            -DRETRO_REVISION=2
          cmake --build build_mania --config Release
          find build_mania -type f

      - name: Package IPA with SonicMania
        run: |
          mkdir -p Payload
          cp -r build_out/RSDKv5.app Payload/
          mkdir -p Payload/RSDKv5.app/Frameworks
          find build_out -name "*.framework" -exec cp -r {} Payload/RSDKv5.app/Frameworks/ \;
          MANIA_BIN=$(find build_mania -name "*SonicMania*" -type f | head -n 1)
          if [ -n "$MANIA_BIN" ]; then
            cp "$MANIA_BIN" Payload/RSDKv5.app/Frameworks/SonicMania
          fi
          ls -la Payload/RSDKv5.app/Frameworks/
          zip -r RSDKv5-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-IPA
          path: RSDKv5-iOS.ipa
